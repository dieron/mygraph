[package]
name = "mygraph-server"
description = "MyGraph binary: HTTP server (REST and admin API; MCP later)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mygraph_server"
path = "src/lib.rs"

[[bin]]
name = "mygraph"
path = "src/main.rs"

[dependencies]
mygraph-core.workspace = true
mygraph-store-sqlite.workspace = true
mygraph-text-tantivy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

ureq = { version = "2.12", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
